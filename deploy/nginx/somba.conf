# KOMORIKO — single-domain nginx reverse proxy
#
# Routes on ONE domain (no CORS needed):
#   /socket.io/  -> API (:3001)  real-time (WebSocket, with HTTP long-polling as the fallback)
#   /api/        -> API (:3001)  REST auth (login/register/refresh/reset) + uploads
#   /uploads/    -> API (:3001)  uploaded images
#   everything   -> Web (:3000)  Next.js
#
# Put this at /etc/nginx/sites-available/somba.conf and symlink into
# sites-enabled. Replace yourdomain.com with your domain (or the droplet IP).

# "upgrade" only when the client really asks for a websocket. Socket.IO long-polling requests (the transport the web
# shop starts on, and the one it keeps when a network refuses the upgrade) have no Upgrade header and must not be sent
# upstream as an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP brute-force protection for login / register / reset (the API also throttles).
limit_req_zone $binary_remote_addr zone=somba_auth:10m rate=10r/m;

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Photo uploads are capped at 5 MB by the API; nginx's 1 MB default would
    # reject them first.
    client_max_body_size 6m;

    # --- Socket.IO (WebSocket + HTTP long-polling) -------------------------
    # MUST come before the "/" block. The web shop connects over long-polling first and upgrades to a websocket when the
    # network allows it; if a network or a proxy refuses the upgrade it simply stays on polling, so BOTH must pass here.
    # The Upgrade/Connection headers are what turn the upgrade into a real WebSocket.
    # Long-polling keeps a session on one server process: with ONE API process (pm2 instances: 1, as deployed) nothing more
    # is needed. If the API is ever run as several processes behind this proxy, pin a client to one of them (an `upstream`
    # block with `ip_hash;`), or polling requests of one session land on different processes and fail.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # a polling answer goes out as soon as the server has it
        proxy_cache off;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
        proxy_send_timeout 3600s;
    }

    # --- Uploaded images (served read-only by the API) ---------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Session renewal: no nginx limit (the API throttles it itself) ----------
    # Apps and browsers renew their tokens here. Under the strict login limit below, several devices on one network
    # (an office Wi-Fi) used up the shared 10 requests a minute and everyone got "Too many attempts": the app could not
    # renew its session, the socket stayed on "connecting" and people were signed out. An exact match wins over the
    # /api/v1/auth/ prefix; the API's own limit on this route (REFRESH_THROTTLE_LIMIT) still applies.
    location = /api/v1/auth/refresh {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Auth endpoints: strict rate limit ----------------------------------
    location /api/v1/auth/ {
        limit_req zone=somba_auth burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- REST API (one-shot auth + image upload + payment webhook) ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js web app ---------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;         # Next HMR/dev only
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
