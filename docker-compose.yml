# Somba&Teka — full local stack (MySQL + API + Web).
#
#   docker compose up --build
#   docker compose exec api npm run seed     # first run: create demo data
#
# Web → http://localhost:3000   API → http://localhost:3001
# For production put nginx in front (see docs/DEPLOYMENT.md) and override the
# secrets/NEXT_PUBLIC_* below with real values.

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: somba
      MYSQL_USER: somba
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # All secrets come from a root .env file (see .env.example). `:?` makes
      # compose refuse to start if one is missing — no insecure fallbacks.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      DB_TYPE: mysql
      DB_SYNCHRONIZE: 'false'   # schema is managed by migrations (run on boot)
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USERNAME: somba
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_DATABASE: somba
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    ports:
      - '3001:3001'

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  mysql-data:
