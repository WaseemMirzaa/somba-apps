name: Customer App · Build APK

# Builds and releases the Somba customer Flutter app (mobile/) as an Android APK
# using Flutter 3.47.7.

on:
  push:
    branches:
      - main
      - claude/customer-app-cicd-ui-xjwzda
    paths:
      - 'mobile/**'
      - '.github/workflows/customer-app-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/customer-app-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Server the APK talks to (base URL, no /api/v1). Empty = repo variable LIVE_API_URL, else http://107.170.116.169'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      # Whether the release key is configured as a repository secret (a secret cannot be tested in a step condition).
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Release signing (docs/ANDROID-RELEASE-SIGNING.md). Only when the repository secret ANDROID_KEYSTORE_BASE64 is set,
      # and never on pull requests (they publish nothing and should not be handed the key). Without the secret nothing
      # here runs and the build is exactly as before (debug-signed, with Gradle's warning).
      - name: Configure release signing
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD is missing. See docs/ANDROID-RELEASE-SIGNING.md."
            exit 1
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          keystore="$RUNNER_TEMP/somba-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "REQUIRE_RELEASE_SIGNING=true"
          } >> "$GITHUB_ENV"

      # Live server + optional keys (docs: mobile/README.md "Install the test APK"). The server URL is the workflow input
      # `api_url`, else the repo variable LIVE_API_URL, else the default below. It is a bare base (scheme + host [+ port]):
      # the app adds /api/v1/... itself, and Socket.IO follows the same host (SOCKET_URL is only set if you ask for it).
      # Maps and Firebase defines are written only when the matching repo secret is set; empty means the feature stays off.
      - name: Resolve live server and build defines
        env:
          INPUT_API_URL: ${{ inputs.api_url }}
          VAR_API_URL: ${{ vars.LIVE_API_URL }}
          VAR_SOCKET_URL: ${{ vars.LIVE_SOCKET_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          url="${INPUT_API_URL:-${VAR_API_URL:-}}"
          url="${url:-http://107.170.116.169}"
          url="${url%/}"; url="${url%/api/v1}"; url="${url%/}"
          case "$url" in http://*|https://*) ;; *) echo "::error::API URL '$url' must start with http:// or https://"; exit 1 ;; esac
          socket="${VAR_SOCKET_URL:-}"
          for v in GOOGLE_MAPS_API_KEY FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID FIREBASE_ANDROID_APP_ID; do
            [ -n "${!v}" ] && echo "::add-mask::${!v}"
          done
          defines="$RUNNER_TEMP/dart-defines.json"
          jq -n --arg api "$url" --arg socket "$socket" \
            --arg maps "$GOOGLE_MAPS_API_KEY" --arg fk "$FIREBASE_API_KEY" --arg fp "$FIREBASE_PROJECT_ID" \
            --arg fs "$FIREBASE_SENDER_ID" --arg fa "$FIREBASE_ANDROID_APP_ID" \
            '{API_URL: $api}
             + (if $socket != "" then {SOCKET_URL: $socket} else {} end)
             + (if $maps != "" then {GOOGLE_MAPS_API_KEY: $maps} else {} end)
             + (if $fk != "" then {FIREBASE_API_KEY: $fk} else {} end)
             + (if $fp != "" then {FIREBASE_PROJECT_ID: $fp} else {} end)
             + (if $fs != "" then {FIREBASE_SENDER_ID: $fs} else {} end)
             + (if $fa != "" then {FIREBASE_ANDROID_APP_ID: $fa} else {} end)' > "$defines"
          {
            echo "DART_DEFINES_FILE=$defines"
            echo "LIVE_SERVER_URL=$url"
            # The Android Maps SDK key is a manifest placeholder filled by Gradle from this property (build.gradle.kts).
            [ -n "$GOOGLE_MAPS_API_KEY" ] && echo "ORG_GRADLE_PROJECT_GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY"
            true
          } >> "$GITHUB_ENV"
          {
            echo "### Customer APK"
            echo "Talks to: $url"
            echo "Maps key: $([ -n "$GOOGLE_MAPS_API_KEY" ] && echo set || echo 'not set (map off)')"
            echo "Firebase: $([ -n "$FIREBASE_API_KEY" ] && echo set || echo 'not set (push off)')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK (universal)
        run: flutter build apk --release --dart-define-from-file="$DART_DEFINES_FILE"

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --dart-define-from-file="$DART_DEFINES_FILE"

      - name: Rename universal APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/somba-customer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: somba-customer-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: customer-apk-v${{ github.run_number }}
          name: Somba Customer App — APK build ${{ github.run_number }}
          body: |
            Automated release of the Somba customer Android app.

            - Built with Flutter ${{ env.FLUTTER_VERSION }}
            - **Server: `${{ env.LIVE_SERVER_URL }}`** (the app talks to this server)
            - Commit: ${{ github.sha }}

            Download `somba-customer.apk` (universal) below and install on any Android device.
          files: mobile/build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
